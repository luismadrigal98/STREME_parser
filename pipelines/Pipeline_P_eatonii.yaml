# Worked example: end-to-end pipeline for Penstemon eatonii
#
# This is a concrete, runnable counterpart to the generic
# `Pipeline_promotor_discovery.yaml` template. It captures the exact
# choices made for the P. eatonii run on a non-model organism with
# RepeatModeler 1.x available (no 2.x install on the host), a custom
# repeat library, TRF chained for SSR masking, an order-3 background,
# STREME → FIMO → TOMTOM, and exploratory motif co-occurrence + gene
# clustering.
#
# Adapt the paths to your own environment if you reuse this template.

project:
  name: "Penstemon eatonii Promoter Analysis"
  description: "STREME → FIMO → TOMTOM → consolidate → network exploration"
  date_created: "2026-06-08"
  conda_env: "PyR"
  hpc_notes: |
    Each long step is a separate SLURM job; the short downstream steps
    are chained in a single job. Matching submit scripts live in
    scripts/submit_*_P_eatonii.sh and link via --dependency=afterok.

input:
  genome_fasta: penstemon_eatonii/PeChr.BYU.final.fa
  genome_gff:   penstemon_eatonii/penstemon_eatonii_final_nuclear_cp.gff3
  tf_database:  databases/Ath_TF_binding_motifs.meme   # PlantTFDB Arabidopsis (download separately)

# ---------------------------------------------------------------------------
# Stage 1 — One-time per species: build a custom RepeatMasker library.
# RepeatModeler 1.x writes the library to RM_<timestamp>/consensi.fa.classified
# (1.x uses -pa, -engine ncbi; -LTRStruct is not available).
# ---------------------------------------------------------------------------
commands:

  - name: "Build species-specific repeat library (RepeatModeler 1.x)"
    runtime_hint: "1-5 days; submit as a standalone SLURM job"
    submit_script: scripts/submit_rm_P_eatonii.sh
    command: >
      python /home/l338m483/bin/STREME_parser/cli_tools/genome_prep.py model-repeats
      penstemon_eatonii/PeChr.BYU.final.fa
      --output-dir repeats/P_eatonii
      --name P_eatonii
      --threads "$SLURM_CPUS_PER_TASK"
      --legacy

  # ---------------------------------------------------------------------------
  # Stage 2 — Resolve the 1.x library to a stable symlink so the rest of the
  # pipeline can reference repeats/P_eatonii/library.fa instead of a timestamped
  # RM_<date>/ subdir that changes on every rebuild.
  # ---------------------------------------------------------------------------
  - name: "Resolve library path (1.x → stable symlink)"
    command: >
      LIB=$(ls -t repeats/P_eatonii/RM_*/consensi.fa.classified 2>/dev/null | head -1) &&
      [ -s "$LIB" ] && ln -sfn "$(realpath "$LIB")" repeats/P_eatonii/library.fa &&
      echo "library -> $(realpath repeats/P_eatonii/library.fa)"

  # ---------------------------------------------------------------------------
  # Stage 3 — Extract promoters, mask (RepeatMasker custom lib + TRF for SSRs),
  # build order-3 background, run STREME (50 motifs), and FIMO scan inline.
  # Chromosomes filtered with --contig-pattern; --avoid-overlap clips windows
  # short of adjacent genes (dense annotations at 2 kb upstream).
  # ---------------------------------------------------------------------------
  - name: "Prepare promoters and discover motifs"
    runtime_hint: "Submit as SLURM job; ~96 GB RAM recommended for STREME on 27k promoters"
    submit_script: scripts/submit_prepare_P_eatonii.sh
    command: >
      streme-parser prepare
      --genome P_eatonii
      --fasta penstemon_eatonii/PeChr.BYU.final.fa
      --annotation penstemon_eatonii/penstemon_eatonii_final_nuclear_cp.gff3
      --contig-pattern '^PeChr'
      --upstream 2000
      --avoid-overlap
      --mask repeatmasker --mask-lib repeats/P_eatonii/library.fa
      --extra-mask trf
      --background-order 3
      --nmotifs 50
      --threads "$SLURM_CPUS_PER_TASK"
      --output prepared_penstemon_eatonii
      --run-fimo --fimo-qv-thresh --fimo-thresh 0.05 --fimo-max-strand

  # Quick masking sanity check (target: >= 30% masked on a plant genome).
  - name: "Diagnostic: masked fraction after RepeatMasker + TRF"
    command: >
      awk '!/^>/{n+=length($0); for(i=1;i<=length($0);i++){c=substr($0,i,1); if(c=="N"||c~/[a-z]/) m++}} END{printf "masked fraction: %.3f\n", m/n}'
      prepared_penstemon_eatonii/P_eatonii_prep/P_eatonii_promoters.masked.trf

  # ---------------------------------------------------------------------------
  # Stage 4 — Match each STREME motif to known Arabidopsis TF PWMs (TOMTOM).
  # ---------------------------------------------------------------------------
  - name: "TOMTOM: annotate STREME motifs vs A. thaliana TFs (PlantTFDB)"
    command: >
      streme-parser annotate prepared_penstemon_eatonii/
      --target-db databases/Ath_TF_binding_motifs.meme
      --thresh 0.1
      --jobs 1

  # ---------------------------------------------------------------------------
  # Stage 5 — Consolidate redundant STREME motifs (sliding-window variants,
  # near-identical IUPAC families) and validate the consolidation.
  # ---------------------------------------------------------------------------
  - name: "Consolidate similar motifs within the genome"
    command: >
      streme-parser consolidate prepared_penstemon_eatonii/
      --output outputs/consolidated_P_eatonii
      --threshold 0.75

  - name: "Validate consolidation quality"
    command: >
      streme-parser validate outputs/consolidated_P_eatonii.tsv

  # ---------------------------------------------------------------------------
  # Stage 6 — Exploratory analysis with no expression data required:
  # motif co-occurrence network + gene clustering by motif profile,
  # plus per-cluster motif fingerprints and a positional summary.
  # ---------------------------------------------------------------------------
  - name: "Motif co-occurrence network + gene clustering"
    command: >
      streme-parser network outputs/consolidated_P_eatonii.tsv
      --output network_P_eatonii/
      --min-motif-sites 20
      --min-jaccard 0.15 --min-lift 2.5 --fdr 0.01
      --n-clusters 30

# ---------------------------------------------------------------------------
# Expected outputs (created by the stages above)
# ---------------------------------------------------------------------------
outputs:
  repeat_library:
    - repeats/P_eatonii/RM_<timestamp>/consensi.fa.classified
    - repeats/P_eatonii/library.fa                        # stable symlink

  prepared_tree:
    - prepared_penstemon_eatonii/P_eatonii_prep/P_eatonii_promoters.fasta
    - prepared_penstemon_eatonii/P_eatonii_prep/P_eatonii_promoters.masked
    - prepared_penstemon_eatonii/P_eatonii_prep/P_eatonii_promoters.masked.trf
    - prepared_penstemon_eatonii/P_eatonii_prep/background.txt
    - prepared_penstemon_eatonii/streme_P_eatonii/{streme.txt,streme.html,sites.tsv}
    - prepared_penstemon_eatonii/fimo_P_eatonii/{fimo.tsv,fimo.html}
    - prepared_penstemon_eatonii/tomtom_P_eatonii/{tomtom.tsv,tomtom.html}

  consolidated:
    - outputs/consolidated_P_eatonii.tsv
    - outputs/consolidated_P_eatonii_summary.txt

  network:
    - network_P_eatonii/motif_cooccurrence_edges.tsv
    - network_P_eatonii/motif_cooccurrence_network.graphml   # → Cytoscape / Gephi
    - network_P_eatonii/motif_modules.tsv                    # join to tomtom.tsv for TF labels
    - network_P_eatonii/gene_clusters.tsv                    # → topGO / clusterProfiler
    - network_P_eatonii/gene_cluster_fingerprints.tsv
    - network_P_eatonii/motif_positional_summary.tsv
    - network_P_eatonii/network_summary.txt

# ---------------------------------------------------------------------------
# Pre-requisites to confirm before submitting
# ---------------------------------------------------------------------------
prerequisites:
  - "TRF installed in PyR (mamba install -c bioconda trf)"
  - "PlantTFDB Arabidopsis MEME-format DB downloaded to databases/Ath_TF_binding_motifs.meme"
  - "streme-parser on PATH (or call via bin/streme-parser absolute path)"
