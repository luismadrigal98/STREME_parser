# Promoter / Regulatory-Element Discovery Pipeline
# Genome-generic configuration. Each preprocessing step maps to a runnable
# subcommand of pipelines/streme_pipeline.py (prepare) or cli_tools/genome_prep.py.
#
# Works for any genome+annotation pair (e.g. Penstemon virgatus, P. barbatus,
# Mimulus guttatus). Provide one or many genomes; multiple genomes are prepared
# in parallel, a single genome parallelises its heavy steps via --threads.

project:
  name: "Promoter Analysis"
  description: "Detect promoters and regulatory elements from genome assemblies"
  date_created: "2025-07-08"

# ---------------------------------------------------------------------------
# Inputs: one or many (genome, annotation) pairs.
# Either list genomes inline here, or point --manifest at a TSV with columns:
#   genome    fasta    annotation    [expression]
# ---------------------------------------------------------------------------
input:
  manifest: "genomes.tsv"          # tab-separated; see example below
  genomes:                         # inline alternative to a manifest
    - name: "P_virgatus"
      fasta: "/data/Penstemon_virgatus.fa"
      annotation: "/data/Penstemon_virgatus.gff3"
      expression: "/data/virgatus_expression.tsv"   # optional
    - name: "P_barbatus"
      fasta: "/data/Penstemon_barbatus.fa"
      annotation: "/data/Penstemon_barbatus.gff3"

# ---------------------------------------------------------------------------
# Parallelism
#   jobs    = number of genomes prepared concurrently (process pool)
#   threads = threads handed to each heavy step (RepeatMasker -pa, STREME)
# Total cores used ~= jobs * threads.
# ---------------------------------------------------------------------------
parallelism:
  jobs: 4
  threads: 8

# ---------------------------------------------------------------------------
# Phase 0: Promoter extraction (pure Python, strand-aware, no external tools)
#   CLI:  genome_prep.py extract-promoters genome.fa annot.gff3 -o promoters.fa
#         --upstream 1000 --downstream 0 --feature-type gene [--avoid-overlap]
# ---------------------------------------------------------------------------
promoter_extraction:
  upstream_bp: 1000          # bp upstream of the TSS taken as candidate promoter
  downstream_bp: 0           # bp downstream of the TSS to include
  feature_type: "gene"       # gene | mRNA | transcript
  avoid_overlap: false       # clip a window short of an adjacent gene's body
  min_length: 1              # drop promoters shorter than this
  # Restrict to particular sequences (e.g. assembled chromosomes, dropping
  # scaffolds). Naming differs between assemblies, so use whichever fits:
  #   chromosomes:    explicit allowlist (comma list or a file, one name per line)
  #   contig_pattern: regex matched against the sequence name
  # A feature is kept only if it passes both. Per-genome overrides can be set
  # in the manifest (columns 'chromosomes' / 'contig_pattern').
  chromosomes: null          # e.g. "PeChr1,PeChr2,PeChr3,PeChr4,PeChr5,PeChr6,PeChr7,PeChr8"
  contig_pattern: null       # e.g. "^PeChr"  (keeps chromosomes, drops JBCEGF... scaffolds)

# ---------------------------------------------------------------------------
# Phase 1: Masking (auto-detected external tool; skip with mask: none)
#   CLI:  genome_prep.py mask promoters.fa --masker repeatmasker --species "..."
# ---------------------------------------------------------------------------
masking:
  masker: "repeatmasker"     # repeatmasker | dust | none
  species: "Penstemon"       # RepeatMasker --species (Dfam lookup) — frequently
                             #   insufficient for non-model organisms; prefer library_path
  library_path: null         # --mask-lib: custom RepeatMasker library FASTA (-lib).
                             #   Build one once with `genome_prep.py model-repeats`
                             #   (RepeatModeler). Takes precedence over species when both set.
                             #   Per-genome overrides via the manifest `lib` column.
  extra_mask: "none"         # --extra-mask: chain dust/TRF after the primary masker
                             #   (none | dust | trf | both). Use this when STREME finds
                             #   AT-rich / SSR motifs that TE libraries don't cover.
  trf_path: null             # --trf-path: explicit Tandem Repeats Finder path (else PATH)
  executable_path: null      # --masker-path: explicit RepeatMasker/dust path (else PATH)
  notes: >
    dust is faster but aggressive and can remove legitimate AT-rich promoter
    regions. RepeatMasker needs a species library available on the host.

# ---------------------------------------------------------------------------
# Phase 2: Background model (Markov) — optional, used as STREME --bfile
#   CLI:  genome_prep.py background promoters.masked -o background.txt --order 1
# ---------------------------------------------------------------------------
background_model:
  enabled: true
  markov_order: 1
  executable_path: null      # --fasta-get-markov-path: explicit path (else PATH)

# ---------------------------------------------------------------------------
# Phase 3: Motif discovery (STREME)
#   CLI:  genome_prep.py run-streme promoters.masked -o streme_<genome>
#         --nmotifs 200 --minw 6 --maxw 20 --thresh 0.05 [--background background.txt]
# Output dirs are named streme_<genome> so the consolidator can pick them up.
# ---------------------------------------------------------------------------
motif_discovery:
  tool: "STREME"
  alphabet: "dna"
  nmotifs: 200
  minw: 6
  maxw: 20
  thresh: 0.05
  executable_path: null      # --streme-path: explicit streme path (else PATH)

# ---------------------------------------------------------------------------
# Phase 3b (optional): Motif scan with FIMO using the STREME motifs.
#   Inline:     streme_pipeline.py prepare ... --run-fimo --fimo-thresh 0.05 --fimo-qv-thresh
#   Standalone: streme_pipeline.py scan <prepared_dir> --thresh 0.05 --qv-thresh --jobs N
# Per genome the scan uses streme_<genome>/streme.txt as the motif file,
# <genome>_prep/<genome>_promoters.masked as the sequence file, and
# <genome>_prep/background.txt as the background (falls back to the motif
# file's embedded background if no background.txt is present).
# Promoters are ~1 kb, matching FIMO's recommended scan length.
# ---------------------------------------------------------------------------
motif_scan:
  enabled: false             # --run-fimo in prepare, or use the `scan` subcommand
  tool: "FIMO"
  thresh: 0.0001             # p-value, or q-value when qv_thresh is true
  qv_thresh: false           # interpret thresh as a q-value cutoff (e.g. 0.05)
  no_qvalue: false           # skip q-value computation entirely
  max_strand: false          # report only the higher-scoring strand of overlapping matches
  motif: null                # restrict to a specific motif ID (default: scan all)
  executable_path: null      # --fimo-path: explicit fimo path (else PATH)

# ---------------------------------------------------------------------------
# Phase 4: Consolidation across genomes
#   CLI:  streme_sites_consolidator.py consolidate <output_root> \
#           --output outputs/consolidated_streme_sites --threshold 0.75
# Genome names are taken from the streme_<genome> directory names; a custom
# --name-pattern regex can be supplied if your dir naming differs.
# ---------------------------------------------------------------------------
consolidation:
  similarity_threshold: 0.75
  merge_overlaps: true
  overlap_threshold: 0.5

# ---------------------------------------------------------------------------
# Phase 5: Expression analysis (per-genome / relative-to-reference)
#   CLI:  streme_pipeline.py analyze consolidated.tsv expression.tsv \
#           --type relative --reference-genome <baseline>
# Expression tables: long (Gene | Genome | Expression) or wide (one column per
# genome). The legacy 'Line'/'line' column names are still accepted.
# ---------------------------------------------------------------------------
expression_analysis:
  type: "relative"           # relative | absolute
  reference_genome: "P_virgatus"
  selection_method: "variance"
  top_motifs: 100
  min_sites: 10

# ---------------------------------------------------------------------------
# Validation / refinement against external motif databases (optional, manual)
# ---------------------------------------------------------------------------
validation:
  tomtom:
    threshold: 0.01
  fimo:
    threshold: 0.0001

# ---------------------------------------------------------------------------
# Example manifest (write to genomes.tsv, tab-separated, header required).
# Required: genome, fasta, annotation.
# Optional: expression, chromosomes, contig_pattern, lib, species.
#   - chromosomes / contig_pattern: per-genome sequence filters (override
#     --chromosomes / --contig-pattern).
#   - lib / species: per-genome RepeatMasker library / species (override
#     --mask-lib / --species). `lib` (a RepeatModeler-built library FASTA) wins
#     over `species` for that genome.
# ---------------------------------------------------------------------------
# genome       fasta                          annotation                     expression               contig_pattern  lib
# P_virgatus   /data/Penstemon_virgatus.fa    /data/Penstemon_virgatus.gff3  /data/virgatus_expr.tsv  ^Chr            /repeats/P_virgatus/P_virgatus-families.fa
# P_eatonii    /data/Penstemon_eatonii.fa     /data/Penstemon_eatonii.gff3   /data/eatonii_expr.tsv   ^PeChr          /repeats/P_eatonii/P_eatonii-families.fa
# P_barbatus   /data/Penstemon_barbatus.fa    /data/Penstemon_barbatus.gff3

# Database resources for downstream interpretation
databases:
  - name: "PlantTFDB"
    url: "http://planttfdb.cbi.pku.edu.cn/"
  - name: "PLACE"
    url: "https://www.dna.affrc.go.jp/PLACE/"
  - name: "PlantPAN 4.0"
    url: "https://plantpan.itps.ncku.edu.tw/plantpan4/"

notes:
  - "Use the zoops occurrence model for promoter analysis if switching to MEME."
  - "Consider both TATA and TATA-less promoters."
  - "Promoter extraction respects strand and clips at contig boundaries."
